# Builds Checken for macOS, Windows and Linux on every push and pull request.
#
# - macOS:   app/scripts/make-dmg.sh (UNIVERSAL=1) → Checken-<version>.dmg for
#            Apple silicon and Intel Macs.
# - Windows and Linux: app/scripts/make-windows-linux.sh, the same Docker build
#            used on the Mac → Checken-Setup-<version>.exe, checken_<version>_amd64.deb
#            and Checken-<version>-linux-x86_64.tar.gz.
#
# Each run's files are attached to it (Actions → the run → Artifacts). Pushing a
# version tag such as v0.2.0 also publishes them as a GitHub release.
# Pushes to main also publish the website (app/site) to GitHub Pages, with
# these installers as its Download buttons.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to publish a release for version tags

defaults:
  run:
    working-directory: app

jobs:
  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build and package
        run: UNIVERSAL=1 ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: checken-macos
          path: app/dist/*.dmg
          if-no-files-found: error

  windows-linux:
    name: Windows (.exe) and Linux (.deb, .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded crates and the cross build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            app/target/cross
          key: cross-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: cross-

      - name: Build and package (in Docker)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./scripts/make-windows-linux.sh

      # The container builds as root; let the runner read and cache the results.
      - name: Fix file ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" dist target ~/.cargo/registry || true

      - uses: actions/upload-artifact@v4
        with:
          name: checken-windows
          path: app/dist/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: checken-linux
          path: |
            app/dist/*.deb
            app/dist/*-linux-x86_64.tar.gz
          if-no-files-found: error

  # The public website (app/site) on GitHub Pages, with the installers this
  # run just built as its downloads, so the site always offers the newest
  # build. Runs for pushes to main (and manual runs on main).
  # One-time setup: Settings → Pages → Build and deployment → Source:
  # "GitHub Actions". The site is then at https://<owner>.github.io/<repo>/.
  #
  # Two jobs, as GitHub's own Pages template does: the deploy step reads the
  # site artifact back through GitHub's API, and asked in the same job right
  # after the upload it may not see it yet ("No artifacts named github-pages").
  website:
    name: Build website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [macos, windows-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Put the site and the latest downloads together
        run: ./app/site/assemble.sh artifacts _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  website-deploy:
    name: Publish website (GitHub Pages)
    needs: website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows-linux]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
